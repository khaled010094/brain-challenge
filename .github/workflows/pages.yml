name: Validate and deploy Brain Challenge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate PWA manifest and required files
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); for (const i of m.icons) { if (!fs.existsSync(i.src.replace(/^\.\//,''))) throw new Error('Missing icon: '+i.src); } if (!fs.existsSync('index.html') || !fs.existsSync('sw.js')) throw new Error('Missing app entry files'); console.log('Manifest and required PWA files are valid.');"
      - name: Check game JavaScript syntax
        run: |
          node -e "const fs=require('fs'); const vm=require('vm'); const html=fs.readFileSync('index.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)]; if (!scripts.length) throw new Error('No inline scripts found'); scripts.forEach((m,i)=>new vm.Script(m[1],{filename:'inline-'+i+'.js'})); console.log('All inline JavaScript parses successfully.');"
      - name: Check expected game content
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('index.html','utf8'); const count=(s.match(/\\{ar:/g)||[]).length; if (count!==50 || !s.includes('function start(') || !s.includes('function answer(')) throw new Error('Expected 50 puzzles and game functions; found '+count); console.log('Game source checks passed: '+count+' puzzles.');"
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
