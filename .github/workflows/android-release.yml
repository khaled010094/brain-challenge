name: Build Brain Challenge Google Play AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  release-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release Android App Bundle
        run: |
          for attempt in 1 2 3; do
            gradle --no-daemon --refresh-dependencies bundleRelease && exit 0
            echo "Build attempt $attempt failed; waiting before retry"
            sleep 20
          done
          exit 1
      - name: Upload unsigned Play App Bundle for signing
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Challenge-Google-Play-AAB-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
